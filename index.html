<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Command Code Desktop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-top">
          <span class="brand"><span class="brand-mark">⌘</span> Command Code</span>
          <button id="collapse" class="icon-btn" title="사이드바 접기 (Ctrl+B)"></button>
        </div>
        <div class="side-actions">
          <button id="new-chat" class="btn primary wide"></button>
          <button id="open-folder" class="btn wide"></button>
        </div>
        <div class="side-label">프로젝트</div>
        <nav id="projects"></nav>
        <div class="side-foot">
          <div id="account-switch"></div>
          <button id="open-settings" class="btn ghost wide"></button>
          <div id="cli-version" class="muted small"></div>
        </div>
      </aside>

      <main id="main">
        <div id="tabbar">
          <button id="expand" class="icon-btn hidden" title="사이드바 펼치기 (Ctrl+B)"></button>
          <div id="tabs" role="tablist"></div>
          <button id="new-tab" class="icon-btn" title="새 채팅 (Ctrl+N)"></button>
          <button id="new-term" class="icon-btn" title="터미널 탭 — TUI 그대로 (Ctrl+T)"></button>
          <span class="tab-spacer"></span>
          <button id="usage-gauge" class="usage-gauge" title="사용량"></button>
        </div>
        <div id="views"></div>
        <div id="home"></div>
      </main>
    </div>

    <dialog id="settings"></dialog>
  </body>
</html>
